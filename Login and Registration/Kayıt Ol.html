<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kayıt Ol - T.U App Store</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: #f8fafc;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 460px);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }
    h1 { margin-top: 0; margin-bottom: 8px; font-size: 28px; }
    p { margin-top: 0; color: #dbeafe; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-weight: 600; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); outline: none;
      background: rgba(15,23,42,0.55); color: #fff;
    }
    button {
      width: 100%; margin-top: 18px; border: none; border-radius: 10px; padding: 12px 14px; cursor: pointer;
      background: linear-gradient(90deg, #3b82f6, #1d4ed8); color: white; font-weight: 700;
    }
    .link { margin-top: 14px; text-align: center; }
    .link a { color: #bfdbfe; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hesap Oluştur</h1>
    <p>T.U App Store'a katılın ve yeni içeriklere erişin.</p>
    <form onsubmit="return kayitOl(event)">
      <label for="name">Ad Soyad</label>
      <input id="name" type="text" placeholder="Adınız Soyadınız" required />
      <label for="email">E-posta</label>
      <input id="email" type="email" placeholder="ornek@eposta.com" required />
      <label for="password">Parola</label>
      <input id="password" type="password" placeholder="En az 6 karakter" required />
      <button type="submit">Kayıt Ol</button>
    </form>
    <div class="link"><a href="Giriş Yap.html">Zaten hesabınız var mı? Giriş yapın</a></div>
    <div class="link"><a href="../index.html">Anasayfaya dön</a></div>
    <a href=""></a>
  </div>
  <script>
    function kayitOl(event) {
      event.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!name || !email || password.length < 6) return false;
      localStorage.setItem('aktifKullanici', name.split(' ')[0] || email.split('@')[0]);
      window.location.href = '../index.html';
      return false;
    }
  </script>
</body>
</html>
